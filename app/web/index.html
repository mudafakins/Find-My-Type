<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Find My Type — Wordmark Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- When this scrolls out of view the header condenses -->
  <div id="top-sentinel" aria-hidden="true"></div>

  <main class="main">

    <!-- Wordmark input + global preview controls (sticky header) -->
    <header class="app-header">
    <section class="workspace panel" aria-label="Wordmark preview controls">
      <div class="name-row">
        <div class="name-field">
          <label class="label" for="word">TYPE COMPANY NAME</label>
          <input id="word" class="word-input" value="Forma" placeholder="Type a company name" maxlength="100">
        </div>
        <div class="header-right">
          <button id="shortlist-button" class="shortlist-button" type="button" aria-controls="shortlist" aria-expanded="false" title="Compare and export your favourites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-9.2-9.1C1.7 7.8 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.3 3.3 4.2 6.4C19.5 15.4 12 20 12 20Z"/></svg>
            <span>Shortlist</span>
            <span id="shortlist-badge" class="badge" hidden>0</span>
          </button>
          <button id="app-menu" class="icon-btn app-menu-button" type="button" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
          </button>
          <button id="theme" title="Switch light / dark theme" aria-label="Toggle dark mode">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15.4A8.5 8.5 0 0 1 8.6 4 8.5 8.5 0 1 0 20 15.4Z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
          </button>
        </div>
      </div>

      <div class="style-controls">
        <div class="size-group">
          <label class="label" for="size">Preview size <span id="sizevalue">42</span></label>
          <input id="size" class="size" type="range" min="18" max="80" value="42">
        </div>
        <div class="palette-group">
          <span class="label">Card palette</span>
          <div class="palette-row">
            <!-- Replaced at runtime by the in-app colour picker (see app.js) -->
            <label class="color-wrap"><input id="ink" type="color" value="#1a1a1a">Text</label>
            <label class="color-wrap"><input id="paper" type="color" value="#ffffff">Background</label>
            <button id="swap-colours" class="icon-btn" type="button" title="Swap text and background" aria-label="Swap text and background colours">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 4 7l3 3M4 7h16M17 20l3-3-3-3M20 17H4"/></svg>
            </button>
            <button id="palette-presets" class="presets-trigger" type="button" aria-haspopup="dialog" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3.5"/><circle cx="16" cy="8" r="3.5"/><circle cx="8" cy="16" r="3.5"/><circle cx="16" cy="16" r="3.5"/></svg>
              <span>Presets</span>
            </button>
          </div>
        </div>
      </div>
    </section>
    </header>

    <!-- Font library: source tabs, connect/import, search, category filters -->
    <section class="library panel" aria-label="Font library">
    <div class="library-bar">
      <nav class="sources" aria-label="Font source">
        <div class="source-tabs">
          <span class="tab-indicator" aria-hidden="true"></span>
          <button data-source="google">Google Fonts</button>
          <button data-source="local" class="active">Local Fonts</button>
        </div>
        <button id="rescan" class="icon-btn" type="button" title="Rescan installed fonts (after installing new ones)" aria-label="Rescan installed fonts" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4.5h-4.5"/></svg>
        </button>
        <button id="import">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Import fonts</span>
        </button>
        <input id="files" type="file" accept=".ttf,.otf,.woff,.woff2" multiple hidden>
      </nav>
      <label class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="search" class="search" type="text" placeholder="Search fonts…" aria-label="Search font names" autocomplete="off" spellcheck="false">
        <kbd class="search-hint" aria-hidden="true">⌘K</kbd>
        <button id="clear-search" class="search-clear" type="button" title="Clear search (Esc)" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
        </button>
      </label>
    </div>

    <!-- Category filters -->
    <div class="toolbar">
      <div id="filters" class="filters" aria-label="Font category"></div>
    </div>
    </section>

    <!-- Result count + sorting -->
    <div class="meta">
      <span id="count"></span>
      <div class="meta-actions">
        <div id="sort-controls" class="sort-controls" aria-label="Font sorting"></div>
        <button id="clear-favourites">Clear favourites</button>
        <div class="view-toggle" role="group" aria-label="Layout">
          <button data-view="grid" title="Grid view" aria-label="Grid view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
          </button>
          <button data-view="list" title="List view" aria-label="List view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4.5" width="16" height="6" rx="1.5"/><rect x="4" y="13.5" width="16" height="6" rx="1.5"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="sentinel" class="sentinel"></div>
  </main>

  <!-- Shortlist drawer: favourites side by side + export -->
  <aside id="shortlist" class="drawer" aria-label="Shortlist" hidden>
    <header class="drawer-head">
      <div>
        <h2 class="drawer-title">Shortlist</h2>
        <span id="shortlist-count" class="drawer-sub"></span>
      </div>
      <div class="case-toggle" role="group" aria-label="Letter case">
        <button type="button" data-case="both" aria-pressed="true" title="Both cases">Aa</button>
        <button type="button" data-case="upper" aria-pressed="false" title="Uppercase">AA</button>
        <button type="button" data-case="lower" aria-pressed="false" title="Lowercase">aa</button>
      </div>
      <button id="shortlist-close" class="icon-btn" type="button" aria-label="Close shortlist" title="Close (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </header>
    <ol id="shortlist-list" class="drawer-list"></ol>
    <footer id="shortlist-footer" class="drawer-foot">
      <button id="export-png" type="button" class="btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></svg>
        <span>PNG + details</span>
      </button>
      <button id="export-pdf" type="button" class="btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></svg>
        <span>Export PDF</span>
      </button>
    </footer>
  </aside>

  <script src="fonts.js"></script>
  <script src="app.js"></script>
</body>
</html>
