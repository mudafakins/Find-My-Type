<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My Type — Wordmark Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><style>
:root{--page:#f4f4f4;--panel:#fafafa;--ink:#242424;--muted:#767676;--line:#dedede;--control:#fff;--selected:#303030;--on-selected:#fff;--hover:#ebebeb}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body.dark{--page:#161616;--panel:#202020;--ink:#ededed;--muted:#a0a0a0;--line:#393939;--control:#282828;--selected:#e2e2e2;--on-selected:#202020;--hover:#333}
button,input,select{font:inherit}button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:inherit;background:transparent;border:1px solid var(--line);border-radius:7px;padding:8px 12px;transition:background .15s,border-color .15s}button:hover{background:var(--hover)}button:disabled{opacity:.45;cursor:default}button svg,.search-wrap svg{width:16px;height:16px;flex:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #888;outline-offset:3px}.main{max-width:1920px;margin:auto;padding:28px 32px 20px}
.workspace{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:26px}.name-row{display:flex;align-items:center;gap:32px;padding:24px 24px 20px}.name-field{flex:1;min-width:0}.label{display:block;font-size:10px;font-weight:600;letter-spacing:1.3px;color:var(--muted);margin-bottom:9px}.word-input{display:block;width:100%;padding:0;background:transparent;border:0;color:var(--ink);font-size:34px;font-weight:500;letter-spacing:-1.2px;line-height:1.25;outline:none}.word-input:focus{outline:none}.name-field:focus-within .label{color:var(--ink)}.header-right{display:flex;gap:8px;align-items:center}#export{background:var(--selected);color:var(--on-selected);border-color:var(--selected);padding:11px 16px;font-weight:500}#export:hover{opacity:.85}#theme{width:39px;height:39px;padding:0;background:var(--control)}
.style-controls{display:flex;align-items:center;gap:28px;padding:14px 24px;border-top:1px solid var(--line)}.size-group{display:flex;align-items:center;gap:16px}.size-group .label,.palette-group .label{margin:0;letter-spacing:.2px;font-size:11px;font-weight:500;text-transform:none}.size-group .label span{display:inline-block;min-width:25px;padding:3px 5px;background:var(--hover);border-radius:4px;margin-left:6px;color:var(--ink);font-variant-numeric:tabular-nums}.size{width:120px;height:20px;margin:0;accent-color:#777}.palette-group{display:flex;align-items:center;gap:16px;padding-left:28px;border-left:1px solid var(--line)}.palette-row{display:flex;align-items:center;gap:16px}.color-wrap{display:inline-flex;align-items:center;gap:8px}.color-wrap input{width:22px;height:22px}.colour-control{display:inline-flex}.colour-trigger{padding:0;border:0;border-radius:3px;gap:7px;font-size:12px;background:transparent!important}.colour-chip{display:block;width:22px;height:22px;border:1px solid #8885;border-radius:5px}
.library-bar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.sources{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.source-tabs{display:flex;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-right:10px}.source-tabs button{border:0;padding:8px 13px;border-radius:5px;font-weight:500}.source-tabs button.active{background:var(--selected);color:var(--on-selected)}#connect,#import{border-color:transparent;color:var(--muted);font-size:12px;padding:8px}#connect:hover,#import:hover{color:var(--ink)}.search-wrap{position:relative;display:flex;align-items:center;flex:0 0 200px}.search-wrap svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}.search{width:100%;padding:10px 10px 10px 35px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;outline:none}.search::placeholder{color:var(--muted)}
.toolbar{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:14px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{font-size:12px;border-radius:6px;padding:7px 11px;border-color:transparent;color:var(--muted)}.filters button:hover{color:var(--ink)}.filters button.active{background:#d5d5d5;border-color:#c8c8c8;color:#222}body.dark .filters button.active{background:#484848;border-color:#555;color:#fff}.meta{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;min-height:32px;font-size:11px;color:var(--muted)}.meta-actions{display:flex;gap:14px;align-items:center}.sort-controls{display:flex;gap:5px}.sort-controls button{font-size:11px;padding:6px 9px;border-color:transparent}.sort-controls button.active{background:var(--hover);color:var(--ink);border-color:var(--line)}.sort-controls svg{width:14px;height:14px}#clear-favourites{font-size:11px;padding:6px 9px;border:0;border-left:1px solid var(--line);border-radius:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{position:relative;border:1px solid transparent;border-radius:10px;overflow:hidden;min-width:0;transition:border-color .15s,box-shadow .15s}.card:hover,.card:focus-within{border-color:#dcdcdc;box-shadow:0 4px 18px #00000004}body.dark .card:hover,body.dark .card:focus-within{border-color:#444}.card-head{height:57px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;opacity:.72}.card-head strong{font-size:12px;font-weight:500;line-height:1.4}.heart{padding:0;width:28px;height:28px;border:0;font-size:24px;flex:none;background:transparent}.heart.saved{color:inherit;opacity:1}.sample{height:220px;padding:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:25px;overflow:hidden}.sample div{white-space:nowrap;max-width:100%;line-height:1.2}.card-foot{padding:9px 18px;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.5px;opacity:0;transition:opacity .15s}.options{padding:9px 14px 12px;display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .15s;font-size:10px;border-top:1px solid #8882}.card:hover .card-foot,.card:focus-within .card-foot{opacity:.6}.card:hover .options,.card:focus-within .options{opacity:1}.options select{min-width:0;max-width:108px;border:1px solid #8884;background:transparent;color:inherit;border-radius:4px;padding:5px;font-size:10px}.options button{padding:4px 7px;border-color:#8884;border-radius:4px}.options label{display:flex;align-items:center;gap:5px;margin-left:auto}.options input{width:55px;accent-color:#888}.empty{grid-column:1/-1;padding:90px 20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px}.status{font-size:11px;color:var(--muted);padding:12px 0;line-height:1.6;min-height:32px}
.colour-popover{position:fixed;z-index:1000;padding:16px;background:var(--control);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 32px #0002}.colour-popover[hidden]{display:none}.picker-title{font-size:13px;font-weight:600;margin-bottom:12px}.picker-presets{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:14px}.picker-preset{width:23px;height:23px;border:1px solid #8885;border-radius:4px;padding:0}.picker-field{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;margin:10px 0}.picker-field input[type=range]{width:140px;accent-color:#777}.picker-hex{width:140px;padding:6px;border:1px solid var(--line);border-radius:4px;background:transparent;color:inherit}.picker-done{width:100%;margin-top:8px;padding:7px}
@media(min-width:1600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:1150px){.library-bar{align-items:flex-start}.sources{gap:3px}.source-tabs{margin-right:3px}#connect{max-width:185px;text-align:left;line-height:1.4}.search-wrap{flex-basis:180px}.main{padding:24px}.grid{gap:12px}.options{gap:5px;padding-inline:10px}.options select{max-width:90px}.options input{width:45px}}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.library-bar{flex-wrap:wrap}.search-wrap{flex:1;max-width:300px}.style-controls{gap:18px}.palette-group{padding-left:18px}.name-row{gap:20px}.word-input{font-size:30px}}@media(max-width:600px){.main{padding:16px}.name-row{padding:18px;flex-wrap:wrap}.header-right{margin-left:auto}.name-field{flex-basis:100%}.style-controls{padding:14px 18px;flex-wrap:wrap}.palette-group{padding-left:0;border:0}.sources{gap:6px}.source-tabs{width:100%;margin-right:0}.source-tabs button{flex:1}.search-wrap{max-width:none;flex-basis:100%}.meta{align-items:flex-start;flex-direction:column;gap:8px}.meta-actions{width:100%;justify-content:space-between;gap:5px}.grid{grid-template-columns:1fr}.sample{height:230px}.options{opacity:1}.options select{max-width:120px}.options input{width:70px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="main"><section class="workspace" aria-label="Wordmark preview controls"><div class="name-row"><div class="name-field"><label class="label" for="word">TYPE COMPANY NAME</label><input id="word" class="word-input" value="Forma" placeholder="Type a company name" maxlength="100"></div><div class="header-right"><button id="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></svg><span>Export shortlist</span></button><button id="theme" title="Switch light / dark theme" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15.4A8.5 8.5 0 0 1 8.6 4 8.5 8.5 0 1 0 20 15.4Z"/></svg></button></div></div><div class="style-controls"><div class="size-group"><label class="label" for="size">Preview size <span id="sizevalue">42</span></label><input id="size" class="size" type="range" min="18" max="80" value="42"></div><div class="palette-group"><span class="label">Card palette</span><div class="palette-row"><label class="color-wrap"><input id="ink" type="color" value="#252525">Text</label><label class="color-wrap"><input id="paper" type="color" value="#ffffff">Background</label></div></div></div></section><div class="library-bar"><nav class="sources" aria-label="Font source"><div class="source-tabs"><button data-source="google">Google Fonts</button><button data-source="local" class="active">Local Fonts</button></div><button id="connect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-12 0V8Zm6 9v4"/></svg><span>Click here once to connect local fonts</span></button><button id="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Import fonts</span></button><input id="files" type="file" accept=".ttf,.otf,.woff,.woff2" multiple hidden></nav><label class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" class="search" placeholder="Search fonts…" aria-label="Search font names"></label></div><div class="toolbar"><div id="filters" class="filters" aria-label="Font category"></div></div><div class="meta"><span id="count"></span><div class="meta-actions"><div id="sort-controls" class="sort-controls" aria-label="Font sorting"></div><button id="clear-favourites">Clear favourites</button></div></div><div id="grid" class="grid"></div><div id="sentinel" style="height:20px"></div><div id="status" class="status" role="status"></div></main><script src="app.js?v=20261015-ui"></script></body></html>
